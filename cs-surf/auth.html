<body class="auth-link-page">
  <main class="auth-link-window" aria-labelledby="auth-title">
    <header><a href="/">surfd.</a><span>ACCOUNT SERVICES</span></header>
    <section>
      <p class="auth-eyebrow">A quick stop before the next run.</p>
      <h1 id="auth-title">Your account</h1>
      <p id="auth-description">Checking your link…</p>
      <button id="auth-continue" type="button" hidden>Continue</button>
      <form id="auth-password-form" hidden>
        <label for="auth-new-password">New password</label>
        <input id="auth-new-password" name="password" type="password" autocomplete="new-password" minlength="15" maxlength="128" required aria-describedby="auth-password-hint">
        <p id="auth-password-hint">At least 15 characters. A few words work well.</p>
        <label for="auth-confirm-password">Repeat password</label>
        <input id="auth-confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="15" maxlength="128" required>
        <label class="auth-show"><input id="auth-show-password" type="checkbox"> Show passwords</label>
        <button type="submit">Save password</button>
      </form>
      <p id="auth-link-status" role="status" aria-live="polite"></p>
      <a id="auth-return" href="/?account=1">Back to Surfd →</a>
    </section>
    <footer>Your rank, records and saved settings stay yours.</footer>
  </main>
